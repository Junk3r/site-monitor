app:
  name: Site Monitor

monitor:
  interval_minutes: 30

database:
  url: sqlite:///data/monitor.db

telegram:
  enabled: true

ai:
  enabled: true
  base_url: http://localhost:11434
  model: qwen3.6:latest
  embedding_model: qwen3-embedding:0.6b

keywords:

  roles:
    include:
      # Account management
      - account manager
      - key account
      - strategic account
      - account director
      - account executive
      # Customer success
      - customer success
      - csm
      - client success
      - customer relationship
      - relationship manager
      - retention manager
      - vip account
      - onboarding manager
      - client relations
      - growth manager
      # Business development
      - business development
      - bizdev
      - partnership
      - partner manager
      - commercial manager
      - sales manager
      - sales executive
    exclude:
      - developer
      - engineer
      - frontend
      - backend
      - designer
      - internship
      - intern
      - qa
      - devops
      - data scientist
      - architect
      - russia
      - moscow

  locations:
    - remote
    - work from home
    - anywhere
    # European countries and hubs
    - malta
    - cyprus
    - gibraltar
    - austria
    - belgium
    - bulgaria
    - croatia
    - czech
    - denmark
    - estonia
    - finland
    - france
    - germany
    - greece
    - hungary
    - ireland
    - italy
    - latvia
    - lithuania
    - luxembourg
    - netherlands
    - norway
    - poland
    - portugal
    - romania
    - serbia
    - slovakia
    - slovenia
    - spain
    - sweden
    - switzerland
    - united kingdom
    - uk
    - europe
    - eu
    # UAE
    - uae
    - dubai
    - abu dhabi
    - united arab emirates
    # Frequent iGaming cities
    - london
    - barcelona
    - madrid
    - lisbon
    - warsaw
    - prague
