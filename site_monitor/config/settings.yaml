app:
  name: Site Monitor

monitor:
  interval_minutes: 30

database:
  url: sqlite:///data/monitor.db

telegram:
  enabled: true

keywords:
  include:
    - account manager
    - customer success
    - customer success manager
    - client success
    - business development
    - partnership manager
    - sales manager
    - strategic account manager
  exclude:
    - junior developer
    - frontend
    - backend
    - designer
    - internship

sites:

  - name: Example
    url: https://example.com

  - name: Python
    url: https://python.org

  - name: Playwright
    url: https://playwright.dev

  - name: OpenAI
    url: https://openai.com

  - name: GitHub
    url: https://github.com
