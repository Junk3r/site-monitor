[project]
name = "site_monitor"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "playwright (>=1.61.0,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "selectolax (>=0.4.11,<0.5.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "python-telegram-bot (>=22.8,<23.0)",
    "openai (>=2.50.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
